schema: 1
protocol_version: 4
entrypoint: AGENTS.md
canonical_branch: main
orchestrator: orchestrator

defaults:
  ack_lease_hours: 3
  max_pending_reviews_per_dispatcher: 2
  worker_retry_budget: 3

github:
  task_transport: issue
  task_title_prefix: "[Maestaris task]"
  task_label: "maestaris:task"
  status_labels:
    ready: "maestaris:ready"
    claimed: "maestaris:claimed"
    blocked: "maestaris:blocked"
    needs_review: "maestaris:needs-review"
    accepted: "maestaris:accepted"
    revise: "maestaris:revise"
    rejected: "maestaris:rejected"
  priority_label_prefix: "priority:"
  task_pull_request:
    draft_on_start: true
    branch_prefix: maestaris/task
    link_keyword: Resolves
  native_reviews:
    accepted: APPROVE
    revise: REQUEST_CHANGES
    same_actor_fallback: COMMENT
  projects:
    optional: true
    auto_add_filter: 'is:issue label:"maestaris:task"'
    field_sync:
      enabled: true
      project_id_env: MAESTARIS_PROJECT_ID
      token_env: MAESTARIS_PROJECT_TOKEN
      fields:
        priority: Priority
        status: Status
        worker: Worker
        dispatcher: Dispatcher
        runtime: Runtime
      mappings:
        priority:
          P0: P0
          P1: P1
          P2: P2
        status:
          ready: Todo
          claimed: In Progress
          blocked: In Progress
          needs_review: In Progress
          revise: In Progress
          accepted: Done
          rejected: Done

pools:
  A:
    max_tasks_per_run: 1
  B:
    max_tasks_per_run: 1

scheduler_bootstrap:
  enabled: true
  source: pools
  cadence: hourly
  reconcile_existing: true
  instance_template: "maestaris-{runtime}-pool-{pool}"
  schedule_minutes:
    chatgpt:
      A: 22
      B: 52
    gemini-spark:
      A: 37
      B: 7
  orchestrator_schedule:
    enabled: true
    instance_template: "maestaris-{runtime}-orchestrator"
    schedule_minutes:
      chatgpt: 7
      gemini-spark: 22

protocol_comment_relay:
  enabled: true
  control_branch_template: "maestaris/control/{instance}"
  outbox_path: ".maestaris/outbox"
  workflow: "relay-maestaris-protocol.yml"
  direct_comment_preferred: true

projects:
  - maestaris
  - example-project
