schema: 1
protocol_version: 4
entrypoint: AGENTS.md
canonical_branch: main
orchestrator: orchestrator

defaults:
  ack_lease_hours: 3

github:
  task_transport: issue
  task_title_prefix: "[Zerion task]"
  task_label: "zerion:task"
  status_labels:
    ready: "zerion:ready"
    claimed: "zerion:claimed"
    blocked: "zerion:blocked"
    needs_review: "zerion:needs-review"
    accepted: "zerion:accepted"
    revise: "zerion:revise"
    rejected: "zerion:rejected"
  priority_label_prefix: "priority:"
  task_pull_request:
    draft_on_start: true
    branch_prefix: zerion/task
    link_keyword: Resolves
  native_reviews:
    accepted: APPROVE
    revise: REQUEST_CHANGES
    same_actor_fallback: COMMENT
  projects:
    optional: true
    auto_add_filter: 'is:issue label:"zerion:task"'
    field_sync:
      enabled: false
      project_id_env: ZERION_PROJECT_ID
      token_env: ZERION_PROJECT_TOKEN
      fields:
        priority: Priority
        status: Status
        worker: Worker
        dispatcher: Dispatcher
        runtime: Runtime
      mappings:
        priority:
          P0: P0
          P1: P1
          P2: P2
        status:
          ready: Todo
          claimed: In Progress
          blocked: In Progress
          needs_review: In Progress
          revise: In Progress
          accepted: Done
          rejected: Done

pools:
  A:
    max_tasks_per_run: 1
  B:
    max_tasks_per_run: 1

projects:
  - example-project
