[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "maestaris-orchestration"
version = "0.6.2"
description = "GitHub-native orchestration protocol for persistent web-hosted LLM workers"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
maestaris = "maestaris_orchestration.cli:main"

[tool.setuptools.packages.find]
include = ["maestaris_orchestration*"]
