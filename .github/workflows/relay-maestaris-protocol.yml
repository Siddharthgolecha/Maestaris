name: Relay Maestaris protocol comments

on:
  push:
    branches:
      - 'maestaris/control/**'
    paths:
      - '.maestaris/outbox/*.json'

permissions:
  contents: read
  issues: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check out current main relay runtime
        uses: actions/checkout@v4
        with:
          ref: main
          path: .maestaris-runtime
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .maestaris-runtime
      - name: Relay newly added protocol events
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git show --pretty="" --name-only --diff-filter=A "$GITHUB_SHA" -- '.maestaris/outbox/*.json')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No newly added relay requests."
            exit 0
          fi
          for file in "${files[@]}"; do
            issue_number="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["issue_number"])' "$file")"
            python .maestaris-runtime/scripts/relay_issue_event.py "$file"
            MAESTARIS_ISSUE_NUMBER="$issue_number" python .maestaris-runtime/scripts/sync_github_issue.py
          done
