name: Validate Maestaris

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check chat-first core
        shell: bash
        run: |
          set -euo pipefail
          required=(AGENTS.md README.md VERSION coordination/maestaris.yaml prompts/worker-pool.md prompts/orchestrator.md docs/protocol.md docs/releases/v0.7.0.md)
          for path in "${required[@]}"; do
            test -f "$path" || { echo "missing $path"; exit 1; }
          done
          grep -q '^0\.7\.0$' VERSION
          grep -q '^## 0\.7\.0 — 2026-10-02$' CHANGELOG.md
          grep -q '^mode: chat-first$' coordination/maestaris.yaml
          test ! -d maestaris_orchestration
          test ! -d tests
          test ! -f .github/workflows/relay-maestaris-protocol.yml
          test ! -f .github/workflows/execution-routing-shadow.yml
