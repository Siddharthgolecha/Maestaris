name: Reusable Maestaris Protocol

on:
  workflow_call:
    inputs:
      maestaris_ref:
        description: Maestaris tag, branch, or commit used as the runtime implementation
        required: false
        type: string
        default: main
      project_id:
        description: Optional GitHub ProjectV2 node ID for field synchronization
        required: false
        type: string
        default: ''
    secrets:
      project_token:
        description: Optional token with permission to update the configured ProjectV2
        required: false

permissions:
  contents: read
  issues: write

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@v4

      - name: Check out Maestaris runtime
        uses: actions/checkout@v4
        with:
          repository: Siddharthgolecha/Maestaris
          ref: ${{ inputs.maestaris_ref }}
          path: .maestaris-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Maestaris runtime
        run: python -m pip install -e .maestaris-runtime

      - name: Validate consumer repository
        run: maestaris --root "$GITHUB_WORKSPACE" validate

      - name: Validate protocol event
        run: python .maestaris-runtime/scripts/validate_github_event.py
        env:
          MAESTARIS_PROJECT_ROOT: ${{ github.workspace }}

      - name: Synchronize derived Issue labels
        run: python .maestaris-runtime/scripts/sync_github_issue.py
        env:
          MAESTARIS_PROJECT_ROOT: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Synchronize optional Project fields
        run: python .maestaris-runtime/scripts/sync_project_fields.py
        env:
          MAESTARIS_PROJECT_ROOT: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}
          MAESTARIS_PROJECT_ID: ${{ inputs.project_id }}
          MAESTARIS_PROJECT_TOKEN: ${{ secrets.project_token }}
