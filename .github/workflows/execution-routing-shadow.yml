name: Execution Routing Shadow

on:
  pull_request:
    paths:
      - 'maestaris_orchestration/execution_routing.py'
      - 'tools/orchestrator/**'
      - 'scripts/route_task_shadow.py'
      - 'tests/test_execution_routing.py'
      - 'tests/fixtures/routing_shadow_task.json'
      - '.github/workflows/execution-routing-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Route fixture without external models
        run: |
          mkdir -p .maestaris/shadow
          python scripts/route_task_shadow.py \
            --input tests/fixtures/routing_shadow_task.json \
            --output .maestaris/shadow/route.json
          cat .maestaris/shadow/route.json
      - name: Focused routing tests
        run: python -m unittest tests.test_execution_routing -v
